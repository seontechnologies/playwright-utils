name: Run PR checks
on:
  pull_request:
  workflow_dispatch:

# if this branch is pushed back to back, cancel the older branch's workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Cache node modules
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      # Prisma needs to generate TypeScript types from our schema before typechecking runs
      # Locally, this happens when we start the app.
      - name: Generate Prisma types
        run: cd sample-app/backend && npx prisma generate

      - name: Run typecheck
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Verify build process
        run: npm run build

      - name: Check exports/typesVersions parity
        run: npm run check:exports-parity

      - name: Build documentation
        run: npm run docs:build

      - name: Run unit tests for the library
        run: npm run test:lib

      - name: Run unit test for backend
        run: npm run test:backend

      # frontend tests are in their own file: vitest-ct.yml

  # Installs the packed package into a "type": "module" consumer that uses TypeScript 7, then
  # imports every entry point and runs burn-in through Playwright, on each supported Node major.
  consumer-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run consumer checks
        run: npm run test:consumer
