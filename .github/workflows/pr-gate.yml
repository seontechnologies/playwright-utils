# Single gate that waits for ALL other workflow jobs to complete.
# This is the ONE required check in the branch ruleset.
name: PR Gate

on:
  pull_request:
  push:
    branches: [master]

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: muratkeremozcan/pr-gate@aca2d169c30fe5585b47f8817c15043a45fe76be
        with:
          mode: wait
          skip-same-workflow: true
          skip-list: |
            [
              {
                "workflowFile": "claude-code-review.yml",
                "jobName": "claude-review",
                "jobMatchMode": "prefix"
              }
            ]
          # e2e-test.yml's burn-in job calls a reusable workflow; a run cancelled
          # mid-dispatch can strand the whole thing pending with zero jobs ever
          # registered, which dynamic discovery alone can't see. Hold the gate
          # open until something from that workflow actually shows up.
          wait-for: |
            [
              {
                "workflowFile": "e2e-test.yml"
              }
            ]
